<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thymeleaf Link</title>
</head>
<body>

<h2>링크 표현식</h2>

<a th:href="@{/link}">매개변수 없는 링크</a>
<br>
<a th:href="@{/link(id=3)}">id가 3인 링크</a>

<p>
    전달받은 id:
    <span th:text="${id}">3</span>
</p>

</body>
</html>
