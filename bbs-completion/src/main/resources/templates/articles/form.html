<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>게시글 작성</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50">
    <div th:replace="~{fragments/header :: header}"></div>
    <main class="mx-auto max-w-3xl p-6">
      <form
        th:action="${articleId == null} ? @{/articles} : @{/articles/{id}/edit(id=${articleId})}"
        th:object="${articleForm}"
        method="post"
        class="space-y-4 rounded-xl bg-white p-6 shadow"
      >
        <h1
          th:text="${articleId == null} ? '글쓰기' : '게시글 수정'"
          class="text-2xl font-bold"
        ></h1>
        <div>
          <input
            th:field="*{title}"
            placeholder="제목"
            class="w-full border p-3"
          />
          <p th:errors="*{title}" class="text-red-600"></p>
        </div>
        <div>
          <textarea
            th:field="*{content}"
            rows="12"
            placeholder="내용"
            class="w-full border p-3"
          ></textarea>
          <p th:errors="*{content}" class="text-red-600"></p>
        </div>
        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        /><button class="rounded bg-blue-600 px-4 py-2 text-white">저장</button>
      </form>
    </main>
  </body>
</html>
