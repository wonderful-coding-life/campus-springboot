<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>게시글</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50">
    <div th:replace="~{fragments/header :: header}"></div>
    <main class="mx-auto max-w-4xl p-6">
      <article class="rounded-xl bg-white p-6 shadow">
        <h1 th:text="${article.title}" class="text-2xl font-bold"></h1>
        <p class="mt-2 text-sm text-slate-500">
          <span th:text="${article.author.name}"></span> ·
          <span
            th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}"
          ></span>
        </p>
        <div
          th:text="${article.content}"
          class="my-8 whitespace-pre-wrap"
        ></div>
        <a th:href="@{/articles}">목록</a
        ><span th:if="${isAuthor}"
          ><a th:href="@{/articles/{id}/edit(id=${article.id})}">수정</a>
          <form
            th:action="@{/articles/{id}/delete(id=${article.id})}"
            method="post"
            class="inline"
            onsubmit="return confirm('게시글을 삭제하시겠습니까?');"
          >
            <input
              type="hidden"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}"
            /><button class="text-red-600">삭제</button>
          </form></span
        >
      </article>
    </main>
  </body>
</html>
