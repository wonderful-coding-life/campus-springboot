<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | 게시판</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50">
    <main class="mx-auto flex min-h-screen max-w-md items-center px-4">
      <section class="w-full rounded-2xl bg-white p-8 shadow">
        <a th:href="@{/articles}" class="text-2xl font-bold text-blue-600"
          >게시판</a
        >
        <h1 class="mt-6 text-xl font-bold">로그인</h1>
        <p th:if="${param.error}" class="mt-3 text-sm text-red-600">
          아이디 또는 비밀번호가 올바르지 않습니다.
        </p>
        <form th:action="@{/login}" method="post" class="mt-5 space-y-3">
          <input
            name="username"
            placeholder="아이디"
            required
            class="w-full rounded border p-3"
          /><input
            name="password"
            type="password"
            placeholder="비밀번호"
            required
            class="w-full rounded border p-3"
          /><input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          /><button class="w-full rounded bg-blue-600 p-3 text-white">
            로그인
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
