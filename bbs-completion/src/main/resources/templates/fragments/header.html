<header
  th:fragment="header"
  class="border-b bg-white"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
  <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
    <a th:href="@{/articles}" class="text-xl font-bold text-blue-600">게시판</a>
    <nav class="flex gap-4 text-sm">
      <a sec:authorize="isAnonymous()" th:href="@{/login}">로그인</a>
      <a sec:authorize="isAnonymous()" th:href="@{/members/new}">회원가입</a>
      <span sec:authorize="isAuthenticated()" sec:authentication="name"></span>
      <a sec:authorize="isAuthenticated()" th:href="@{/articles/new}">글쓰기</a>
      <form
        sec:authorize="isAuthenticated()"
        th:action="@{/logout}"
        method="post"
      >
        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        /><button>로그아웃</button>
      </form>
    </nav>
  </div>
</header>
