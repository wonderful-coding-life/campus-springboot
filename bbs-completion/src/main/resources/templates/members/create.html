<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>회원가입 | 게시판</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50">
    <div th:replace="~{fragments/header :: header}"></div>
    <main class="mx-auto max-w-xl p-6">
      <form
        th:action="@{/members}"
        th:object="${memberCreateForm}"
        method="post"
        class="space-y-4 rounded-xl bg-white p-6 shadow"
      >
        <h1 class="text-xl font-bold">회원가입</h1>
        <p
          th:each="e : ${#fields.globalErrors()}"
          th:text="${e}"
          class="text-red-600"
        ></p>
        <div>
          <input
            th:field="*{username}"
            placeholder="아이디"
            class="w-full border p-3"
          />
          <p th:errors="*{username}" class="text-red-600"></p>
        </div>
        <div>
          <input
            th:field="*{password}"
            type="password"
            placeholder="비밀번호"
            class="w-full border p-3"
          />
          <p th:errors="*{password}" class="text-red-600"></p>
        </div>
        <div>
          <input
            th:field="*{passwordConfirm}"
            type="password"
            placeholder="비밀번호 확인"
            class="w-full border p-3"
          />
          <p th:errors="*{passwordConfirm}" class="text-red-600"></p>
          <p th:errors="*{passwordConfirmed}" class="text-red-600"></p>
        </div>
        <div>
          <input
            th:field="*{name}"
            placeholder="이름"
            class="w-full border p-3"
          />
          <p th:errors="*{name}" class="text-red-600"></p>
        </div>
        <div>
          <input
            th:field="*{email}"
            placeholder="이메일"
            class="w-full border p-3"
          />
          <p th:errors="*{email}" class="text-red-600"></p>
        </div>
        <button class="rounded bg-blue-600 px-4 py-2 text-white">
          회원가입
        </button>
      </form>
    </main>
  </body>
</html>
